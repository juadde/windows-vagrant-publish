name: Build and publish Windows 2025 (UEFI) FR input
on:
  workflow_dispatch:
  schedule:
    - cron: 17 10 8,22 * *
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Update runner
        run: |
          sudo apt -yq update
          sudo apt -yq upgrade
      - name: Install dependencies
        run: sudo apt -yq install qemu-system-x86 xorriso p7zip
      - name: Check out repository code
        uses: actions/checkout@master
        with:
          repository: rgl/windows-vagrant
      - name: Change locales to fr-FR
        run: sed -i 's/Locale>en-US</Locale>fr-FR</' ./windows-2025-uefi/autounattend.xml
      - name: Configure version for release
        run: sed -i 's/0.0.0/$(date +%Y%m%d.${{ github.run_number }})/' box-metadata.sh
      - name: Create cache dir and temp dir for packer
        run: mkdir -p ${{ github.workspace }}/{.cache,.temp}
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build vagrant box
        env:
          PACKER_GITHUB_API_TOKEN: ${{ secrets.PACKER_GITHUB_API_TOKEN }}
        run: PACKER_CACHE_DIR=${{ github.workspace }}/.cache TMPDIR=${{ github.workspace }}/.temp make build-windows-2025-uefi-libvirt
      - name: Upload box and logs as an artifact
        uses: actions/upload-artifact@master
        with:
          name: box
          path: |
            *.box
            *.box.json
            *.log

  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    concurrency:
      group: catalog-publish
      cancel-in-progress: false
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Get box files
        uses: actions/download-artifact@v4
        with:
          name: box
          path: box
      - name: Install dependencies
        run: pip install --upgrade huggingface_hub
      - name: Upload box to Hugging Face and update the catalog
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ vars.HF_REPO }}
        run: |
          box=$(ls box/windows-2025*.box)
          python3 scripts/publish_box.py \
            --box "$box" \
            --box-name kppqju77/windows-2025-fr-input \
            --version "$(jq -r '.versions[0].version' "$box.json")" \
            --provider "$(jq -r '.versions[0].providers[0].name' "$box.json")" \
            --description "Windows Server 2025 (UEFI) with fr-FR input locales" \
            --hf-repo "$HF_REPO" \
            --catalog docs/windows-2025-fr-input.json \
            --keep 3
      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/windows-2025-fr-input.json
          git commit -m "Publish windows-2025-fr-input $(jq -r '.versions[0].version' docs/windows-2025-fr-input.json)"
          for i in 1 2 3 4; do git pull --rebase && git push && break; sleep $((i*10)); done
