name: Build and publish Windows 11 (UEFI) FR input
on:
  workflow_dispatch:
  schedule:
    - cron: 17 10 1,15 * *
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Update runner
        run: |
          sudo apt -yq update
          sudo apt -yq upgrade
      - name: Install dependencies
        run: sudo apt -yq install qemu-system-x86 xorriso p7zip
      - name: Check out repository code
        uses: actions/checkout@master
        with:
          repository: rgl/windows-vagrant
      - name: Change locales to fr-FR
        run: sed -i 's/Locale>en-US</Locale>fr-FR</' ./windows-11-24h2-uefi/autounattend.xml
      - name: Configure version for release
        run: sed -i 's/0.0.0/$(date +%Y%m%d.${{ github.run_number }})/' box-metadata.sh
      - name: Create cache dir and temp dir for packer
        run: mkdir -p ${{ github.workspace }}/{.cache,.temp}
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build vagrant box
        env:
          PACKER_GITHUB_API_TOKEN: ${{ secrets.PACKER_GITHUB_API_TOKEN }}
        run: PACKER_CACHE_DIR=${{ github.workspace }}/.cache TMPDIR=${{ github.workspace }}/.temp make build-windows-11-24h2-uefi-libvirt
      - name: Upload box and logs as an artifact
        uses: actions/upload-artifact@master
        with:
          name: box
          path: |
            *.box
            *.box.json
            *.log

  publish:
    runs-on: ubuntu-latest
    needs: build
    concurrency:
      group: box-publish
      cancel-in-progress: false
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Get box files
        uses: actions/download-artifact@v4
        with:
          name: box
          path: box
      - name: Install dependencies
        run: pip install --upgrade boto3
      - name: Upload box and update the catalog
        env:
          S3_ENDPOINT_URL: ${{ vars.S3_ENDPOINT_URL }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_PUBLIC_URL: ${{ vars.S3_PUBLIC_URL }}
          AWS_DEFAULT_REGION: ${{ vars.S3_REGION || 'auto' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          BOX_KEEP: ${{ vars.BOX_KEEP || '1' }}
        run: |
          box=$(ls box/windows-11*.box)
          python3 scripts/publish_box.py \
            --box "$box" \
            --box-name kppqju77/windows-11-fr-input \
            --version "$(jq -r '.versions[0].version' "$box.json")" \
            --provider "$(jq -r '.versions[0].providers[0].name' "$box.json")" \
            --description "Windows 11 24H2 (UEFI) with fr-FR input locales" \
            --keep "$BOX_KEEP" \
            ${{ vars.BOX_PRUNE_FIRST == 'true' && '--prune-first' || '' }}
